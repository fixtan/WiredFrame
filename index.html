<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>WiredFrame</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }

      /* 設定モーダルオーバーレイ */
      #settings-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        /* 後ろの画面（セーバーの動き）を見ながら調整できるよう、暗くもぼかしもしない */
        background: transparent;
        pointer-events: none;
        z-index: 200;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #settings-modal.open {
        opacity: 1;
      }
      /* パネルだけが操作を受ける（ドラッグ移動できる） */
      #settings-modal.open .settings-panel {
        pointer-events: auto;
      }

      /* 設定パネル本体 */
      .settings-panel {
        max-height: 94vh;
        overflow-y: auto; /* 項目が増えても、画面が低いモニターで保存ボタンが見切れないように */
        background: rgba(15, 15, 25, 0.92);
        border: 1px solid #00ffff66;
        border-radius: 8px;
        width: 560px;
        max-width: 96vw;
        padding: 18px 22px;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        color: #fff;
        box-sizing: border-box;
      }
      .settings-panel h2 {
        cursor: move; /* タイトルをドラッグしてパネルを動かす（ダブルクリックで中央に戻す） */
        user-select: none;
        touch-action: none;
        margin-top: 0;
        color: #00ffff;
        font-size: 1rem;
        border-bottom: 1px solid #00ffff33;
        padding-bottom: 8px;
        letter-spacing: 1px;
      }
      .setting-group {
        margin-bottom: 10px;
      }
      .setting-group label {
        display: block;
        font-size: 0.78rem;
        color: #aaa;
        margin-bottom: 4px;
      }
      /* 横に並べる行（短い項目をまとめて縦の長さを減らす） */
      .row2,
      .row3 {
        display: grid;
        gap: 10px;
        margin-bottom: 10px;
      }
      .row2 { grid-template-columns: 1fr 1fr; }
      .row3 { grid-template-columns: 1fr 1fr 1fr; }
      .row2 .setting-group,
      .row3 .setting-group { margin-bottom: 0; }
      .check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        font-size: 0.78rem;
        color: #aaa;
        flex-wrap: wrap;
      }
      .tab-bar {
        display: flex;
        gap: 4px;
        margin: 0 0 12px;
        border-bottom: 1px solid #00ffff33;
      }
      .tab-btn {
        background: transparent;
        color: #888;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: 4px 4px 0 0;
        padding: 6px 16px;
        font-size: 0.82rem;
        font-weight: bold;
        cursor: pointer;
      }
      .tab-btn:hover { color: #fff; }
      .tab-btn.active {
        color: #00ffff;
        background: rgba(0, 255, 255, 0.1);
        border-color: #00ffff55;
      }
      .tab-pane { display: none; }
      .tab-pane.active { display: block; }
      .mode-params { margin: 6px 0 10px; font-size: 0.8rem; }
      .mode-params summary { cursor: pointer; color: #00ffffcc; margin-bottom: 6px; }
      .param-row { display: grid; grid-template-columns: 1fr 70px; gap: 2px 8px; align-items: center; margin-bottom: 6px; }
      .param-row label { grid-column: 1 / 3; font-size: 0.72rem; color: #aab; }
      .param-row output { text-align: right; font-variant-numeric: tabular-nums; color: #00ffff; }
      /* 表示モードに無関係な欄を隠す */
      #pane-monitor:not([data-mode="tiles"]) .tile-only { display: none !important; }
      #pane-monitor:not([data-mode="noise1"]) .noise1-only { display: none !important; }
      input[type="range"] { accent-color: #00ffff; width: 100%; }
      .setting-group input[type="text"],
      .setting-group input[type="number"],
      .setting-group select {
        width: 100%;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid #444;
        color: #fff;
        padding: 5px 10px;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 0.85rem;
      }
      .setting-group input:focus,
      .setting-group select:focus {
        border-color: #00ffff;
        outline: none;
      }
      .folder-row {
        display: flex;
        gap: 6px;
        margin-bottom: 6px;
        align-items: stretch;
      }
      .folder-row input.f-name {
        width: 30%;
        flex: none;
      }
      .folder-row input.f-path {
        flex: 1;
        min-width: 0;
      }
      .folder-row button,
      .mini-btn {
        background: #222;
        color: #00ffff;
        border: 1px solid #00ffff55;
        border-radius: 4px;
        cursor: pointer;
        padding: 0 10px;
        font-weight: bold;
      }
      .folder-row button:hover,
      .mini-btn:hover {
        background: rgba(0, 255, 255, 0.2);
      }
      .folder-row button.f-del {
        color: #ff7777;
        border-color: #ff777755;
      }
      .mini-btn {
        padding: 6px 12px;
        font-size: 0.82rem;
      }
      .folder-empty {
        font-size: 0.75rem;
        color: #ffcc66;
        margin-bottom: 6px;
      }
      .path-row {
        display: flex;
        gap: 8px;
      }
      .path-row button {
        background: #222;
        color: #00ffff;
        border: 1px solid #00ffff55;
        white-space: nowrap;
        padding: 0 14px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      .path-row button:hover {
        background: rgba(0, 255, 255, 0.2);
      }
      .settings-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }
      .settings-footer button {
        padding: 7px 18px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        font-size: 0.85rem;
      }
      #save-settings {
        background: #00ffff;
        color: #000;
        border: none;
      }
      #save-settings:hover {
        background: #00cccc;
      }
      #close-settings {
        background: transparent;
        color: #aaa;
        border: 1px solid #444;
      }
      #close-settings:hover {
        color: #fff;
        border-color: #777;
      }
    </style>
  </head>
  <body>
    <!-- main.ts を読み込めなかったとき（import エラーなど）に、理由をターミナルへ出す。
         main.ts が動き出したら（initDebug）、そちらのハンドラに任せる -->
    <script>
      (function () {
        function send(msg) {
          try {
            var t = window.__TAURI_INTERNALS__;
            var label = (t && t.metadata && t.metadata.currentWindow && t.metadata.currentWindow.label) || '?';
            if (t && t.invoke) t.invoke('debug_log', { label: label, level: 'error', message: msg });
          } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          if (window.__debugReady) return;
          var where = e.filename ? ' @' + e.filename + ':' + e.lineno : '';
          var res = e.target && e.target.src ? ' (読み込めない: ' + e.target.src + ')' : '';
          send('起動前のエラー: ' + (e.message || 'script error') + where + res);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (window.__debugReady) return;
          send('起動前の Promise 拒否: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
        });
      })();
    </script>

    <!-- 設定モーダル -->
    <div id="settings-modal" class="settings-modal">
      <div class="settings-panel">
        <h2>WIRED FRAME CONFIGURATION</h2>
        <div id="panel-monitor-label" style="font-size: 0.72rem; color: #00ffff99; margin: -2px 0 10px; word-break: break-all;"></div>

        <!-- タブ（main のパネルだけ。サブのパネルは「このモニター」だけなので出さない） -->
        <div id="tab-bar" class="tab-bar">
          <button type="button" class="tab-btn active" data-tab="monitor">このモニター</button>
          <button type="button" class="tab-btn" data-tab="common">共通設定</button>
        </div>

        <!-- ===== タブ1: このモニターの設定（全パネルに表示） ===== -->
        <div id="pane-monitor" class="tab-pane active" data-mode="tiles">
          <div class="row2">
            <div class="setting-group">
              <label>表示モード</label>
              <select id="select-mode">
                <option value="tiles">画像タイル</option>
                <option value="noise1">ノイズ1（粒子）</option>
                <option value="noise2">ノイズ2（Mandelbulb）</option>
                <option value="noise3">ノイズ3（地形）</option>
                <option value="noise4">ノイズ4（ドメインワーピング）</option>
              </select>
            </div>
            <div class="setting-group">
              <label>FPS 上限（下げると軽くなる）</label>
              <select id="select-fps">
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="60">60</option>
                <option value="120">120</option>
              </select>
            </div>
          </div>
          <div class="setting-group noise1-only">
            <label>粒子の数（多いほど綺麗だが重い）</label>
            <select id="select-noise-size">
              <option value="256">少ない（約 6.5 万）</option>
              <option value="384">標準（約 15 万）</option>
              <option value="512">多い（約 26 万）</option>
            </select>
          </div>
          <!-- モードごとの調整項目（src/modes/params.ts の定義から自動で作る） -->
          <details id="mode-params-box" class="mode-params" style="display: none;">
            <summary>詳細な調整</summary>
            <div id="mode-params"></div>
            <button id="reset-mode-params" type="button" class="mini-btn">この調整を初期値に戻す</button>
          </details>

          <div class="setting-group tile-only">
            <label>このモニターの画像フォルダ</label>
            <select id="select-folder"></select>
          </div>

          <div class="row2 tile-only">
            <div class="setting-group">
              <label>パターン切替間隔（秒）</label>
              <input type="number" id="input-interval" value="12" min="1" />
            </div>
            <div class="setting-group">
              <label>アニメーション再生モード</label>
              <select id="select-play-mode">
                <option value="rotation">ローテーション（順番）</option>
                <option value="random">ランダム切替</option>
                <option value="fixed">固定</option>
              </select>
            </div>
          </div>

          <!-- 固定時のパターン選択（初期非表示） -->
          <div class="setting-group tile-only" id="fixed-pattern-container" style="display: none;">
            <label>固定パターン選択</label>
            <select id="select-fixed-pattern">
              <option value="tile">Tile Mode</option>
              <option value="cardScatter">Card Scatter</option>
              <option value="crystalForm">Crystal Form</option>
              <option value="cylinderWrap">Cylinder Wrap</option>
              <option value="doubleHelix">Double Helix</option>
              <option value="flatWave">Flat Wave</option>
              <option value="matrixRain">Matrix Rain</option>
              <option value="rippleRadial">Ripple Radial</option>
              <option value="spiralFlow">Spiral Flow</option>
              <option value="tunnelDepth">Tunnel Depth</option>
            </select>
          </div>

          <div class="row3 tile-only">
            <div class="setting-group">
              <label>タイルサイズ</label>
              <input type="number" id="input-tile-size" value="2.0" step="0.1" min="0.5" max="5.0" />
            </div>
            <div class="setting-group">
              <label>間隔 横</label>
              <input type="number" id="input-spacing-x" value="4.5" step="0.1" />
            </div>
            <div class="setting-group">
              <label>間隔 縦</label>
              <input type="number" id="input-spacing-y" value="2.8" step="0.1" />
            </div>
          </div>

          <!-- 並べ方（縦画面のモニターは列を減らして行を増やす） -->
          <div class="row2 tile-only">
            <div class="setting-group">
              <label>並べる枚数 横（列）1〜40</label>
              <input type="number" id="input-cols" value="10" step="1" min="1" max="40" />
            </div>
            <div class="setting-group">
              <label>並べる枚数 縦（行）1〜40</label>
              <input type="number" id="input-rows" value="6" step="1" min="1" max="40" />
            </div>
          </div>
          <label class="check-row tile-only">
            <input type="checkbox" id="input-fit-grid">
            <span>全体が画面に収まるようカメラ距離を自動調整する</span>
          </label>

          <div class="setting-group">
            <label>明るさ <span id="brightness-val">100</span>%</label>
            <input type="range" id="input-brightness" min="10" max="100" step="5" value="100" />
          </div>

          <div class="row2 tile-only" style="grid-template-columns: 90px 1fr;">
            <div class="setting-group">
              <label>背景色</label>
              <input type="color" id="input-bg-color" value="#000000" style="height: 32px; width: 100%; padding: 2px; cursor: pointer; box-sizing: border-box;" />
            </div>
            <div class="setting-group">
              <label>背景画像（オプション）</label>
              <div class="path-row">
                <input type="text" id="input-bg-image" placeholder="背景画像のパス..." />
                <button id="browse-bg-btn">参照</button>
              </div>
            </div>
          </div>
        </div>

        <!-- ===== タブ2: 共通設定（main のパネルだけ） ===== -->
        <div id="pane-common" class="tab-pane">
          <div id="global-section">
            <div class="setting-group">
              <label>画像フォルダのリスト（名前を付けて登録。全モニター共通）</label>
              <div id="folder-rows"></div>
              <button id="add-folder-btn" type="button" class="mini-btn">＋ フォルダを追加</button>
            </div>
            <div class="setting-group">
              <label>共通の既定フォルダ（「共通の既定」を選んだモニターが使う）</label>
              <select id="select-default-folder"></select>
            </div>
          </div>

          <div id="global-section-2">
            <div class="setting-group">
              <label>スクリーンセーバーの起動ホットキー（入力欄を選んでキーを押す。Backspace / Delete で解除）</label>
              <input type="text" id="input-hotkey" placeholder="例: Ctrl+Alt+S" readonly style="caret-color: transparent; cursor: pointer;" />
              <div id="hotkey-status" style="font-size: 0.75rem; color: #ff8888; margin-top: 4px;"></div>
            </div>
            <label class="check-row">
              <input type="checkbox" id="input-idle-enabled">
              <span>操作が</span>
              <input type="number" id="input-idle-minutes" value="10" step="1" min="1" max="720" style="width: 70px; background: rgba(0,0,0,0.5); border: 1px solid #444; color: #fff; padding: 4px 8px; border-radius: 4px;" />
              <span>分ないとき自動で起動</span>
            </label>
            <label class="check-row">
              <input type="checkbox" id="input-idle-exit">
              <span>自動で起動したセーバーは、キー・マウス操作で終了する（OFF なら ESC のみ。マウスで画面を動かせる）</span>
            </label>
            <label class="check-row">
              <input type="checkbox" id="input-autostart" disabled>
              <span>Windows にログインしたら自動で常駐を始める</span>
            </label>
            <div id="autostart-status" style="font-size: 0.75rem; color: #ff8888; margin: -6px 0 8px;"></div>
            <label class="check-row">
              <input type="checkbox" id="input-multi-monitor">
              <span>マルチモニター連動（全画面一括展開）を有効にする</span>
            </label>
          </div>
        </div>

        <div class="settings-footer">
          <button id="reset-settings" class="btn" style="background: transparent; color: #ff5555; border: 1px solid #ff555555;">このモニターを初期値に戻す</button>
          <div style="flex-grow: 1;"></div>
          <button id="close-settings">キャンセル</button>
          <button id="save-settings">適用して保存</button>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
