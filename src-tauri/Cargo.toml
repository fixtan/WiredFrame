[package]
name = "app"
version = "0.1.1"
description = "WiredFrame - multi-monitor screensaver"
authors = ["fixtan"]
license = ""
repository = "https://github.com/fixtan/WiredFrame"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# Windows ログイン時の自動起動（レジストリの Run キー）
tauri-plugin-autostart = "2"

# 無操作時間（GetLastInputInfo）の取得に使う。Windows のみ
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
